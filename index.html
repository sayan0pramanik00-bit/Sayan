<!DOCTYPE html>
<html>
<head>
<title>Shadow Racing</title>

<style>
body {
    margin: 0;
    background: #222;
    text-align: center;
    font-family: Arial;
    color: white;
}

h1 {
    color: cyan;
}

canvas {
    background: #555;
    border: 4px solid white;
    max-width: 95vw;
}

button {
    padding: 12px 25px;
    margin: 8px;
    font-size: 18px;
    background: cyan;
    border: none;
    border-radius: 8px;
}
</style>
</head>

<body>

<h1>SHADOW RACING 🚗</h1>

<h2>Score: <span id="score">0</span></h2>

<canvas id="game" width="350" height="550"></canvas>

<br>

<button onclick="moveLeft()">⬅ LEFT</button>
<button onclick="moveRight()">RIGHT ➡</button>
<br>
<button onclick="restart()">RESTART</button>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player = {
    x: 150,
    y: 450,
    width: 45,
    height: 75
};

let enemy = {
    x: 70,
    y: -100,
    width: 45,
    height: 75,
    speed: 4
};

let score = 0;
let gameOver = false;

function drawCar(x, y, color) {

    ctx.fillStyle = color;

    ctx.fillRect(x, y, 45, 75);

    ctx.fillStyle = "lightblue";
    ctx.fillRect(x + 8, y + 10, 29, 20);

    ctx.fillStyle = "black";
    ctx.fillRect(x - 4, y + 12, 5, 18);
    ctx.fillRect(x + 44, y + 12, 5, 18);
    ctx.fillRect(x - 4, y + 48, 5, 18);
    ctx.fillRect(x + 44, y + 48, 5, 18);
}

function drawRoad() {

    ctx.fillStyle = "#444";
    ctx.fillRect(0, 0, 350, 550);

    ctx.fillStyle = "white";

    for(let i = 0; i < 550; i += 100) {
        ctx.fillRect(170, i, 8, 50);
    }
}

function update() {

    if(gameOver) return;

    drawRoad();

    drawCar(player.x, player.y, "cyan");

    drawCar(enemy.x, enemy.y, "red");

    enemy.y += enemy.speed;

    if(enemy.y > 550) {
        enemy.y = -100;
        enemy.x = Math.random() * 280;
        score += 10;
        enemy.speed += 0.2;

        document.getElementById("score").innerText = score;
    }

    if(
        player.x < enemy.x + 45 &&
        player.x + 45 > enemy.x &&
        player.y < enemy.y + 75 &&
        player.y + 75 > enemy.y
    ) {

        gameOver = true;

        ctx.fillStyle = "yellow";
        ctx.font = "35px Arial";
        ctx.fillText("GAME OVER", 65, 280);
    }

    requestAnimationFrame(update);
}

function moveLeft() {
    if(player.x > 10 && !gameOver) {
        player.x -= 30;
    }
}

function moveRight() {
    if(player.x < 295 && !gameOver) {
        player.x += 30;
    }
}

document.addEventListener("keydown", function(e) {

    if(e.key === "ArrowLeft") moveLeft();

    if(e.key === "ArrowRight") moveRight();

});

function restart() {

    player.x = 150;
    enemy.x = 70;
    enemy.y = -100;
    enemy.speed = 4;

    score = 0;
    gameOver = false;

    document.getElementById("score").innerText = score;

    update();
}

update();

</script>

</body>
</html>
